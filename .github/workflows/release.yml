name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Release & APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Koi ${{ github.ref_name }} 🎏
          tag_name: ${{ github.ref_name }}
          files: releases/Koi-${{ github.ref_name }}.apk
          body: |
            ## Koi ${{ github.ref_name }} 🎏

            ### 🎨 Koi Pond Playlist QR Sharing & Scanner
            * **Koi Pond QR Cards**: Share any playlist or Liked Songs as full-color Koi Pond art QR cards across Koi Pond, Kohaku Gold, and Lotus Cyan themes with gallery save and share sheet export.
            * **Live Camera Scanner & Import**: Scan playlist QR cards with the in-app CameraX scanner, import images from your gallery or WhatsApp, or open `koi://` links directly.

            ### 🎚️ Audio Studio, 10-Band EQ & 5 DSP Profiles
            * **Live 10-Band FFT & Equalizer**: Real-time 10-band spectrum visualizer on Home with custom saveable EQ presets, Pre-Amp with Headroom Guard, A/B RAW bypass, and Stage depth controls.
            * **5 Redesigned DSP Profiles**: Upgraded Acoustic Profiles with live visual meters and smooth parameter ramping across Stereo, 8D, and 16D modes.

            ### 📝 Official Timed Lyrics & Playback Fixes
            * **Timed Sync & Metadata Repair**: Official Android Music timed `cueRange` synced lyrics with strict variant and script matching, featured/community playlist search, instant loading states, and auto-repaired artist and duration metadata.

            ### 📊 Live Profile Listening Analytics
            * **Listening Insights & Storage**: Live 7-day activity chart, favorite genres, most played songs, top playlists and artists, lifetime listening timer, and storage/memory monitors.
