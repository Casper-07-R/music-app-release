name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Release & APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Koi ${{ github.ref_name }} 🎏
          tag_name: ${{ github.ref_name }}
          files: releases/Koi-${{ github.ref_name }}.apk
          body: |
            ## Koi ${{ github.ref_name }} 🎏

            ### 🎚️ 10-Band Graphic Equalizer (PipeWire bq_peaking from EQ-Clone)
            * **10-Band Precision Filter Chain**: Peaking biquad EQ chain ported from PipeWire with exact frequencies (31Hz, 63Hz, 125Hz, 250Hz, 500Hz, 1kHz, 2kHz, 4kHz, 8kHz, 16kHz with Q=1.41).
            * **EQ Presets**: Instant presets for Flat, Bass, Treble, Vocal, Pop, Rock, Jazz, Classic, Nightcore, and Slowed + Reverbed.
            * **Interactive Fader Sliders**: Studio-grade slider controls with real-time dB gain readouts (-12 dB to +12 dB) and master bypass toggle.
            * **Player & Settings Integration**: Dedicated Equalizer button in the music player interface; Reset option cleanly organized in Settings.

            ### 🌌 8D & 16D Spatial Audio Harmonization & Stacking
            * **Seamless Stacking**: Full multi-layer DSP support allowing Equalizer presets and custom curves to stack seamlessly with 8D and 16D spatial panning without state resets.
            * **Phase-Synced 16D Audio**: Multi-dimensional Lissajous figure-8 orbit ($x = \sin\theta, y = \sin 2\theta$) with front-to-back elevation cueing and seamless horizontal phase synchronization with 8D.
            * **Expanded Panning Floor**: Lowered minimum audio floor on the opposite ear from 15% to 10% for deeper, richer spatial panning.
            * **Nightcore & Slowed Re-architecture**: Converted Nightcore and Slowed+Reverbed into pure EQ profiles without forced spatial panning.

            ### 📱 UX & Interaction Refinements
            * **Tap-Outside Scrim Dismiss**: Bottom sheets (Equalizer, 8D Studio, Profile Selector, and Sleep Timer) now dismiss instantly when tapping outside.
            * **Smooth Back-Stack Navigation**: Refined back handlers across all screens and sheets.
            * Refined back-stack navigation handling nested artist and album transitions smoothly.
