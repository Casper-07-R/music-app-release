name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Release & APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Koi ${{ github.ref_name }} 🎏
          tag_name: ${{ github.ref_name }}
          files: releases/Koi-${{ github.ref_name }}.apk
          body: |
            ## Koi ${{ github.ref_name }} 🎏

            ### 📶 Adaptive Audio Quality & Zero-Buffering Streaming
            * **Multi-Tier Audio Fallback**: Comprehensive audio format ladder with seamless degradation across High (Opus 160k / AAC 128k), Medium (Opus 70k), Low (Opus 50k), and Very Low / Data Saver (AAC 48k).
            * **Real-time Network Coverage Monitor**: Dynamically tracks link bandwidth, cellular generation (2G, 3G, 4G, 5G), and Wi-Fi signal to adapt playback bitrates before buffering occurs.
            * **Dynamic Stall Watchdog**: Automatically transitions to lower bitrate streams if buffering persists (>2.5s) or recurs, eliminating audio tearing on weak or unstable signals.
            * **Custom Streaming Preferences**: Interactive ROG-styled Streaming Quality sheet in Settings to select Auto, High, Medium, Low, or Data Saver modes.

            ### 🎮 Interactive Game Mechanics Onboarding Tutorial
            * **Guaranteed First-Run Walkthrough**: The interactive tutorial now plays automatically the very first time the app is opened after installing.
            * **Cinematic Spotlight Walkthrough**: Complete HUD quest-driven walkthrough introducing 360° audio & 10-band EQ, sound stations, private vault, adaptive streaming quality, and gentle bedtime timers.
            * **Replay Support**: Replay the onboarding tutorial anytime from Settings -> Replay Game Mechanics Tutorial.

            ### 🖐️ Gesture & Stability Refinements
            * **Swipe-to-Dismiss Mini-Player**: Swipe the floating Now Playing bar horizontally left or right to dismiss it cleanly.
            * **Crash Prevention**: Resolved startup initialization order race condition in PlayerEngine.
